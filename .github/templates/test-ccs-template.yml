name: Test CCS v{{VERSION}}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [Debug, Release]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build with CCS v{{VERSION}} - ${{ matrix.config }}
        id: build
        uses: uoohyo/action-ccstudio-ide@v{{VERSION}}
        continue-on-error: true
        with:
          project-path: 'projects/f28335_v{{VERSION}}'
          project-name: 'f28335_v{{VERSION}}'
          build-config: ${{ matrix.config }}
          components: 'PF_C28'

      - name: Verify Build Output
        id: verify
        run: |
          set -euo pipefail
          PROJECT_DIR="projects/f28335_v{{VERSION}}"
          OUTPUT_PATH="$PROJECT_DIR/${{ matrix.config }}/f28335_v{{VERSION}}.out"
          if [ -s "$OUTPUT_PATH" ]; then
            echo "Build successful: $OUTPUT_PATH"
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Expected output absent: $OUTPUT_PATH"
          find "$PROJECT_DIR" -type f \( -name '*.out' -o -name '*.elf' \) -print || true
          mapfile -d '' FILES < <(find "$PROJECT_DIR" -type f \( -name '*.out' -o -name '*.elf' \) -size +0c -print0)
          COUNT=0
          for file in "${FILES[@]}"; do
            if [[ "$file" == *"/${{ matrix.config }}/"* ]]; then
              COUNT=$((COUNT + 1))
            fi
          done
          if [ "$COUNT" -eq 1 ]; then
            echo "Found unique nonempty binary in configuration directory"
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Expected unique output for ${{ matrix.config }}; found $COUNT"
          echo "status=failure" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Save Test Result
        if: always() && matrix.config == 'Debug'
        run: |
          STATUS="${{ steps.verify.outputs.status || 'failure' }}"
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          mkdir -p .github/test-results
          cat > .github/test-results/{{VERSION}}.json <<EOF
          {
            "version": "{{VERSION}}",
            "status": "$STATUS",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "log_url": "$LOG_URL"
          }
          EOF

      - name: Upload Test Result
        if: always() && matrix.config == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: test-result-{{VERSION}}
          path: .github/test-results/{{VERSION}}.json
          retention-days: 90
